name: LiftPod
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
targets:
  LiftPod:
    type: application
    platform: iOS
    sources:
      - LiftPod
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.liftpod.rawmotion
        PRODUCT_NAME: LiftPod
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LiftPod
        INFOPLIST_KEY_NSMotionUsageDescription: LiftPod uses AirPods motion data to display and save raw sensor readings.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    scheme:
      testTargets:
        - LiftPodTests
  LiftPodTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LiftPodTests
    dependencies:
      - target: LiftPod
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.liftpod.rawmotion.tests
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
